<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E55" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E60023" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#darkBg)"/>
  <circle cx="400" cy="450" r="350" fill="url(#redGlow)"/>
  
  <rect x="100" y="100" width="600" height="800" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  <rect x="120" y="120" width="560" height="760" fill="none" stroke="#FF2E55" stroke-width="1" opacity="0.4"/>
  
  <text x="400" y="320" font-family="'Syne', 'Helvetica', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">AURA</text>
  <text x="400" y="380" font-family="sans-serif" font-weight="300" font-size="20" fill="#FF2E55" text-anchor="middle" letter-spacing="12">LUXURY BRAND FLYER</text>
  
  <line x1="250" y1="430" x2="550" y2="430" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Central Diamond -->
  <polygon points="400,480 480,560 400,640 320,560" fill="none" stroke="#FF2E55" stroke-width="6"/>
  <circle cx="400" cy="560" r="20" fill="#FFFFFF"/>

  <text x="400" y="740" font-family="'Syne', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">VISUAL ART DIRECTION</text>
  <text x="400" y="780" font-family="sans-serif" font-size="16" fill="#888899" text-anchor="middle">DESIGNED BY DAYAH // 2026</text>
</svg>
