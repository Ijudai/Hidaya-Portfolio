<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F8"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E60023"/>
      <stop offset="100%" stop-color="#FF2E55"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#cardGrad)"/>
  
  <!-- Red Geometric Frame -->
  <path d="M 0 0 L 450 0 L 300 1000 L 0 1000 Z" fill="url(#redAccent)"/>
  
  <!-- Overlay Circle -->
  <circle cx="450" cy="500" r="280" fill="none" stroke="#E60023" stroke-width="24" opacity="0.15"/>
  <circle cx="450" cy="500" r="200" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.9"/>
  
  <!-- Text Elements -->
  <text x="60" y="200" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="80" fill="#FFFFFF">RED</text>
  <text x="60" y="280" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="80" fill="#FFFFFF">RHYTHM</text>
  <text x="60" y="340" font-family="sans-serif" font-weight="700" font-size="24" fill="rgba(255,255,255,0.85)" letter-spacing="6">LIVE MUSIC &amp; VISUALS</text>

  <text x="420" y="700" font-family="'Syne', sans-serif" font-weight="800" font-size="48" fill="#111116">FLYER DESIGN</text>
  <text x="420" y="750" font-family="sans-serif" font-weight="600" font-size="22" fill="#E60023" letter-spacing="3">BRAND IDENTITY &amp; PROMO</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="940" width="800" height="60" fill="#111116"/>
  <text x="50" y="978" font-family="sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="2">DAYAH VISUAL STUDIO 2026</text>
  <text x="750" y="978" font-family="sans-serif" font-size="18" fill="#FF2E55" text-anchor="end" font-weight="bold">FLYER #02</text>
</svg>
