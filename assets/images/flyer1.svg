<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0F14"/>
      <stop offset="100%" stop-color="#1A1A24"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad1)"/>
  <rect width="800" height="1000" fill="url(#gridPattern)"/>

  <!-- Red Spatial Elements -->
  <circle cx="650" cy="200" r="300" fill="url(#redGrad1)" opacity="0.85"/>
  <rect x="80" y="140" width="640" height="8" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Typography / Spatial Artwork -->
  <text x="80" y="240" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" letter-spacing="-2">SPATIAL</text>
  <text x="80" y="320" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="#FF2E55" letter-spacing="-2">VISION 2026</text>
  
  <!-- Abstract Design Shapes -->
  <rect x="80" y="380" width="220" height="280" rx="16" fill="#FFFFFF" opacity="0.06" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <circle cx="190" cy="520" r="70" fill="none" stroke="#FF2E55" stroke-width="12"/>
  
  <!-- Red Floating Pill -->
  <rect x="340" y="440" width="380" height="180" rx="90" fill="url(#redGrad1)"/>
  <text x="530" y="545" font-family="sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DESIGN EXP</text>

  <!-- Graphic Accents -->
  <line x1="80" y1="720" x2="720" y2="720" stroke="#FF2E55" stroke-width="4"/>
  <text x="80" y="780" font-family="sans-serif" font-size="20" fill="#A0A0B0" letter-spacing="2">VISUAL POSTER DESIGN // VOL. 01</text>
  <text x="80" y="820" font-family="sans-serif" font-size="16" fill="#FFFFFF" opacity="0.6">CREATIVE DIRECTION &amp; TYPOGRAPHY BY DAYAH</text>
  
  <text x="720" y="820" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FF2E55" text-anchor="end">#01</text>
</svg>
